    -D THESIS_V003_F12_INDICATOR_PREVIEW_OPT_IN=1
    -D THESIS_V003_F13_SUPERVISED_DRIVER=1
    -D THESIS_V003_F13_LIVE_OUTPUTS=0
    -D THESIS_V003_F13_EXPLICIT_OPT_IN=0
    -D THESIS_V003_F13_HARDWARE_REVIEWED=0
    -D THESIS_V003_F17_INTEGRATED_PREFLIGHT=1
    -D THESIS_V003_F17_EXPLICIT_OPT_IN=1
    -D THESIS_V003_F18_WEATHER_INTERFACE=1
    -D THESIS_V003_F18_EXPLICIT_OPT_IN=1
    -D THESIS_V003_F19_DUAL_DISPLAY=1
    -D THESIS_V003_F19_EXPLICIT_OPT_IN=1
    -D THESIS_V003_F15_SD_PILOT_ARMED=1
    -D THESIS_F22_FLEET_OPERATIONAL=1
    -D THESIS_FLEET_USB_ENROLLMENT=1
    -D THESIS_DTN_F24D_BUILD_ONLY=1
    -D THESIS_DTN_F24E_BUILD_ONLY=1
    -D THESIS_DTN_F24F_BUILD_ONLY=1
    -D THESIS_DTN_F24G_BUILD_ONLY=1
    -D THESIS_DTN_F24H_BUILD_ONLY=1
    -D THESIS_DTN_F24I_BUILD_ONLY=1
    -D THESIS_DTN_F24J_BUILD_ONLY=1
    -UTHESIS_V003_F15_SD_PILOT_ARMED
    -UTHESIS_F22_FLEET_OPERATIONAL
    -UTHESIS_FLEET_USB_ENROLLMENT
    -UTHESIS_F23D_SD_ROLE
    -D THESIS_DTN_F24K_SD_INTERPOSE_BUILD_ONLY=1
    -D THESIS_DTN_F24M_BUILD_ONLY=1
    -D THESIS_DTN_F24N_BUILD_ONLY=1
    -D THESIS_DTN_F24O_BUILD_ONLY=1
    -D THESIS_DTN_F24P_BUILD_ONLY=1
    -D THESIS_DTN_F24Q_BUILD_ONLY=1
    -D THESIS_DTN_F24R_BUILD_ONLY=1
    -D THESIS_DTN_F24S_BUILD_ONLY=1
    -D THESIS_DTN_F24T_BUILD_ONLY=1
    -D THESIS_DTN_F24U_BUILD_ONLY=1
    -D THESIS_DTN_F24V_BUILD_ONLY=1
    -D THESIS_DTN_F24W_BUILD_ONLY=1
    -D THESIS_DTN_F24X_BUILD_ONLY=1
    -D THESIS_DTN_F24Y_BUILD_ONLY=1
    -Wl,--undefined=thesis_f24y_link_anchor
    -D THESIS_DTN_F24Z_BUILD_ONLY=1
    -Wl,--undefined=thesis_f24z_link_anchor
    -D THESIS_DTN_F25A_BUILD_ONLY=1
    -D THESIS_DTN_F25B_BUILD_ONLY=1
    -Wl,--undefined=thesis_f25b_link_anchor
    -D THESIS_DTN_F25C_BUILD_ONLY=1
    -D THESIS_DTN_F26B_BUILD_ONLY=1
    -D THESIS_DTN_F26C_BUILD_ONLY=1
    -D THESIS_STUDY_SF_BUILD_ONLY=1
    -Wl,--undefined=thesis_study_sf_link_anchor
    -D THESIS_STUDY_SF_UNIVERSAL_OFFLINE=1
lib_deps =
    jgromes/RadioLib @ ^6.6.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit BME680 Library @ ^2.0.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    lewisxhe/XPowersLib @ ^0.2.6
    olikraus/U8g2 @ ^2.35.19
    robtillaart/DHT20 @ ^0.3.3
    SD

