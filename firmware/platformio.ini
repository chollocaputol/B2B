[env:tbeam-supreme]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; CRITICAL: These flags force the ESP32-S3 to route serial output 
; through the native USB port so you can debug in VS Code.
build_flags = 
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    ; LoRa Transceiver
    jgromes/RadioLib @ ^6.6.0
    
    ; GNSS/GPS Parsing
    mikalhart/TinyGPSPlus @ ^1.0.3
    
    ; I2C Sensors (BME680 for pressure, AHTX0/DHT20 for Temp/Humidity)
    adafruit/Adafruit BME680 Library @ ^2.2.4
    adafruit/Adafruit AHTX0 @ ^2.0.5
    
    ; OLED Display
    adafruit/Adafruit SSD1306 @ ^2.5.11
    adafruit/Adafruit GFX Library @ ^1.11.9
    
    ; Data Serialization (SD Card & Supabase POST)
    bblanchon/ArduinoJson @ ^7.1.0