; Universal T-Beam Supreme firmware.
; Select an environment explicitly; enrollment is for supervised provisioning only.
[platformio]
default_envs = tbeam-supreme-offline

[env:tbeam-supreme-offline]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1
    -D THESIS_V003_F09_SHARED_SENSOR_BUS=1
