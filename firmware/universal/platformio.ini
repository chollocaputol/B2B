[env:tbeam-supreme]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Force the correct flash size and partition table layout for 8MB hardware
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1

lib_deps =
    jgromes/RadioLib @ ^6.6.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit BME680 Library @ ^2.0.4
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    lewisxhe/XPowersLib @ ^0.2.6
    olikraus/U8g2 @ ^2.35.19
    robtillaart/DHT20 @ ^0.3.3
; Controlled bench relay build. NEVER use for sea deployment.
[env:tbeam-supreme-lab-v002]
extends = env:tbeam-supreme
build_flags =
    ${env:tbeam-supreme.build_flags}
    -D THESIS_LAB_RELAY_TX=1

; Isolated microSD hardware test.
[env:tbeam-supreme-lab-v002-sd-probe]
extends = env:tbeam-supreme-lab-v002
build_flags =
    ${env:tbeam-supreme-lab-v002.build_flags}
    -D THESIS_SD_PROBE=1
lib_deps =
    ${env:tbeam-supreme.lib_deps}
    SD

; Isolated SD logger validation. Vessel-002 only.
; Bench relay remains unauthenticated: laboratory use only.
[env:tbeam-supreme-lab-v002-sd-logger]
extends = env:tbeam-supreme-lab-v002
build_flags =
    ${env:tbeam-supreme-lab-v002.build_flags}
    -D THESIS_SD_LOGGER=1
lib_deps =
    ${env:tbeam-supreme.lib_deps}
    SD

; F11 identity-aware SD logger. Inherits normal firmware, NOT lab SOS relay.
; Build-only until SD and radio regression is validated on physical vessels.
[env:tbeam-supreme-sd-logger]
extends = env:tbeam-supreme
build_flags =
    ${env:tbeam-supreme.build_flags}
    -D THESIS_SD_LOGGER=1
    -D THESIS_SD_FLEET=1
lib_deps =
    ${env:tbeam-supreme.lib_deps}
    SD

; F05 staged crash-recovery experiment. No SD journal, no lab relay.
; Never use for operational deployment before reviewed hardware acceptance.
[env:tbeam-supreme-f05-recovery]
extends = env:tbeam-supreme
build_flags =
    ${env:tbeam-supreme.build_flags}
    -D THESIS_F05_RECOVERY=1

; F06 experimental integration: F05 recovery + identity-aware SD logger.
; No laboratory relay. Build-only until hardware safety review.
[env:tbeam-supreme-f06-sd-f05]
extends = env:tbeam-supreme-sd-logger
build_flags =
    ${env:tbeam-supreme-sd-logger.build_flags}
    -D THESIS_F05_RECOVERY=1

; F06 isolated microSD hardware test: fresh journal folder each boot.
; Keeps original /THESIS/VESSEL_XXX paths untouched; never enable lab relay.
[env:tbeam-supreme-f06-sandbox]
extends = env:tbeam-supreme-f06-sd-f05
build_flags =
    ${env:tbeam-supreme-f06-sd-f05.build_flags}
    -D THESIS_F06_SD_SANDBOX=1

; F06 SD OLED read-only status UI. No SD path, SOS, relay or export changes.
; Build and validate on Vessel-002 before any deployment.
[env:tbeam-supreme-f06-sandbox-sd-ui]
extends = env:tbeam-supreme-f06-sandbox
build_flags =
    ${env:tbeam-supreme-f06-sandbox.build_flags}
    -D THESIS_SD_OLED_UI=1

; F06 opt-in hybrid SD recording: SOS ARMED by default, manual continuous.
; Isolated per-boot sandbox journals. No unauthenticated lab relay.
[env:tbeam-supreme-f06-sandbox-hybrid]
extends = env:tbeam-supreme-f06-sandbox-sd-ui
build_flags =
    ${env:tbeam-supreme-f06-sandbox-sd-ui.build_flags}
    -D THESIS_F06_SD_HYBRID=1

; F07 experimental 10-minute weather timing; F06 sandbox features preserved.
; Build-only sandbox; NOT an operational deployment profile.
[env:tbeam-supreme-f07-weather-sandbox]
extends = env:tbeam-supreme-f06-sandbox-hybrid
build_flags =
    ${env:tbeam-supreme-f06-sandbox-hybrid.build_flags}
    -D WEATHER_FAST_TEST=0
    -D THESIS_F07_WEATHER_LOG=1

; Vessel-003 F08 hardware-preflight only. BUILD ONLY: DO NOT UPLOAD.
; Weather setup/polling skipped, preserving GPIO38/39 from sensor I2C use.
; F08 output gate remains OFF and pins -1 by enforced compile-time guard.
; Not for Vessel-001 or -002; no relay, no SD logger or F05 recovery.
[env:tbeam-supreme-v003-f08-bench-build-only]
extends = env:tbeam-supreme
build_flags =
    ${env:tbeam-supreme.build_flags}
    -D THESIS_V003_F08_INDICATOR_BENCH=1
    -D WEATHER_FAST_TEST=0

; F08 Vessel-003 LED-only PREPARATION; never upload this build-only profile.
; The existing policy and buzzer stay completely disabled/unassigned.
; The header contains future GPIO39/44 control behind compile-time locks,
; but the mandatory static_assert prevents enabling them in this environment.
[env:tbeam-supreme-v003-f08-led-preflight-build-only]
extends = env:tbeam-supreme-v003-f08-bench-build-only
build_flags =
    ${env:tbeam-supreme-v003-f08-bench-build-only.build_flags}
    -D THESIS_V003_F08_LED_BENCH=1
    -D THESIS_V003_F08_LED_OUTPUTS_ENABLE=0
    -D THESIS_V003_F08_LED_HARDWARE_REVIEWED=0

; LED-only manual actuation on *Vessel-003* after operator wiring confirmation.
; Intended for short bench tests only: sensor operations skipped; relay, SD,
; buzzer and production physical indicator adapter remain OFF.
; Build and inspect BEFORE any flash; never use on 001/002 or field deployment.
[env:tbeam-supreme-v003-f08-led-live-v003-only]
extends = env:tbeam-supreme-v003-f08-bench-build-only
build_flags =
    ${env:tbeam-supreme-v003-f08-bench-build-only.build_flags}
    -D THESIS_V003_F08_LED_BENCH=1
    -D THESIS_V003_F08_LED_OUTPUTS_ENABLE=1
    -D THESIS_V003_F08_LED_HARDWARE_REVIEWED=1
    -D THESIS_V003_F08_LED_LIVE_PROFILE=1

; Vessel-003 F08 buzzer software-only preflight. BUILD ONLY; DO NOT UPLOAD.
; No GPIO38 setup/writes. Existing LED-live environment is unchanged.
; No external buzzer power until B-LDO2 voltage/current and wiring verified.
; Weather sensor I2C skipped; production indicators, relay and SD disabled.
[env:tbeam-supreme-v003-f08-buzzer-preflight-build-only]
extends = env:tbeam-supreme-v003-f08-bench-build-only
build_flags =
    ${env:tbeam-supreme-v003-f08-bench-build-only.build_flags}
    -D THESIS_V003_F08_BUZZER_PREFLIGHT=1
    -D THESIS_V003_F08_BUZZER_OUTPUTS_ENABLE=0

; Vessel-003 ONLY, manual SFM-20B buzzer pulse test after power/wiring review.
; NOT for sea deployment. Do not flash until B-LDO2 voltage/current checked.
; No weather sensors, SD logger, relay or simultaneous LED-live output.
; Dedicated GPIO38 250ms command-only output; production F08 adapter OFF.
[env:tbeam-supreme-v003-f08-buzzer-live-v003-only]
extends = env:tbeam-supreme-v003-f08-bench-build-only
build_flags =
    ${env:tbeam-supreme-v003-f08-bench-build-only.build_flags}
    -D THESIS_V003_F08_BUZZER_LIVE_PROFILE=1
    -D THESIS_V003_F08_BUZZER_LIVE_EXPLICIT_OPT_IN=1

; Vessel-003 only. Combined GPIO38/39/44 physical indicator BENCH.
; Sensor I2C on GPIO38/39 is disabled. Does not modify real weather/radio SOS.
; Simulated weather/SOS commands expire after 6s; NOT deployment firmware.
; Separate from LED-only and buzzer-only profiles, no SD and no relay.
[env:tbeam-supreme-v003-f08-combined-live-v003-only]
extends = env:tbeam-supreme-v003-f08-bench-build-only
build_flags =
    ${env:tbeam-supreme-v003-f08-bench-build-only.build_flags}
    -D THESIS_V003_F08_COMBINED_PROFILE=1
    -D THESIS_V003_F08_COMBINED_EXPLICIT_OPT_IN=1

; F09 vessel-003 only, shared external I2C bus BME680+DHT20 on GPIO21/48.
; Sensor/firmware bring-up only: F08 physical outputs, SD logger and relay OFF.
; Existing OLED 17/18 and all other environment pin assignments unchanged.
; 5-second accelerated samples: NOT a validated 100-minute weather history.
; Build/review before flash; move DHT20 wires only while unpowered.
[env:tbeam-supreme-v003-f09-shared-i2c-sensors-v003-only]
extends = env:tbeam-supreme
build_flags =
    ${env:tbeam-supreme.build_flags}
    -D THESIS_V003_F09_SHARED_SENSOR_BUS=1
    -D THESIS_V003_F09_SHARED_SENSOR_BUS_OPT_IN=1
    -D WEATHER_FAST_TEST=1

; F10 Vessel-003 experimental micro nowcast, strictly isolated from physical
; indicators, relay, SD, and the F08 bench. DHT20+BME680 share GPIO21/48.
; Micro: 60s reads, 10-minute trends. Macro remains on REAL 10-minute cycle.
; Thresholds are exploratory risk signals, NOT calibrated storm forecasts.
[env:tbeam-supreme-v003-f10-micro-nowcast-v003-only]
extends = env:tbeam-supreme
build_flags =
    ${env:tbeam-supreme.build_flags}
    -D THESIS_V003_F09_SHARED_SENSOR_BUS=1
    -D THESIS_V003_F09_SHARED_SENSOR_BUS_OPT_IN=1
    -D THESIS_V003_F10_MICRO_NOWCAST=1
    -D THESIS_V003_F10_MICRO_NOWCAST_OPT_IN=1
    -D WEATHER_FAST_TEST=0
